[project]
name = "arxiv2md-beta"
version = "0.15.1"
description = "Convert arXiv papers to Markdown with image support. Supports both HTML and LaTeX parsing modes."
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "httpx>=0.25.0",
    "loguru>=0.7.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "tiktoken>=0.7.0",
    "Pillow>=10.0.0",  # For PDF to PNG conversion
    "pdf2image>=1.16.0",  # For PDF to PNG conversion
    "aiofiles>=24.0.0",  # Async file I/O
    "typer>=0.12.0",
]

[project.optional-dependencies]
latex = [
    "pypandoc>=1.12",
    "TexSoup>=0.3.0",
]

[project.scripts]
arxiv2md-beta = "arxiv2md_beta.cli:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = { find = { where = ["src"] } }

[tool.setuptools.package-data]
"arxiv2md_beta.config" = ["*.yml", "environments/*.yml"]
"arxiv2md_beta.schemas" = ["json/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Benchmark calibration (tests/benchmarks) stays out of the default run
# (audit5 T-5): invoke it explicitly via `pytest tests/benchmarks`.
norecursedirs = ".* build dist CVS _darcs {arch} *.egg tests/benchmarks"
# Real-network tests are opt-in: `pytest -m real_paper` (they hit arxiv.org
# and would otherwise run by default on any machine with proxy env vars set).
addopts = "-m 'not real_paper'"
markers = [
    "real_paper: tests that download and parse real arXiv papers (requires network + proxy)",
]

[tool.coverage.run]
source = ["src/arxiv2md_beta"]
omit = ["*/config/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "D",   # pydocstyle
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "ASYNC", # flake8-async
]
ignore = [
    "D100",  # Missing docstring in public module
    "D101",  # Missing docstring in public class
    "D102",  # Missing docstring in public method
    "D103",  # Missing docstring in public function
    "D104",  # Missing docstring in public package
    "D105",  # Missing docstring in magic method
    "D107",  # Missing docstring in __init__
    "D203",  # 1 blank line required before class docstring (conflicts with D211)
    "D213",  # Multi-line docstring summary should start at the second line (conflicts with D212)
    "B008",  # typer.Option/Argument in default args is standard for CLI apps
    "TCH001", # Moving imports into TYPE_CHECKING blocks is noisy for this codebase
    "TCH002",
    "TCH003",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# CLI-layer async functions doing one exists()/stat() guard: offloading each
# to a thread costs more than the syscall, by design (see AGENTS.md).
"src/arxiv2md_beta/cli/app.py" = ["ASYNC240"]
"src/arxiv2md_beta/cli/runner/paper_yml.py" = ["ASYNC240"]
"tests/test_integration_with_mocks.py" = ["ASYNC240"]
# Atomic-write tests assert on real pathlib results inside async test bodies.
"tests/test_atomic_io.py" = ["ASYNC240"]

[tool.ruff.lint.isort]
known-first-party = ["arxiv2md_beta"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true
warn_unreachable = false
strict_equality = false
ignore_missing_imports = true
show_error_codes = true
exclude = ["tests/", "demo/"]

# uv-native dev group: `uv sync` installs it by default (the old
# [project.optional-dependencies].dev extra was invisible to uv sync, so
# tooling silently vanished from synced environments — audit5 T-1/T-6).
[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-benchmark>=4.0.0",
    "pytest-cov>=7.1.0",
    "respx>=0.20.0",
    "pre-commit>=3.0.0",
    "ruff>=0.6.0",
    "mypy>=1.8.0",
    "types-aiofiles>=24.0.0",
    "types-beautifulsoup4>=4.12.0",
]
